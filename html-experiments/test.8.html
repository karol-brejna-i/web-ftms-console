<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS-BT-D2 Console v8</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007bff; --accent: #ff4757; --success: #2ed573; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; text-align: center; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .val { font-size: 2.2rem; font-weight: bold; color: var(--primary); display: block; }
        .hr-val { color: var(--accent); }
        .unit { color: #777; font-size: 0.7rem; text-transform: uppercase; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        button { padding: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-connect { background: var(--primary); color: white; width: 100%; margin-bottom: 5px; }
        .btn-disconnect { background: #444; color: white; width: 100%; margin-bottom: 15px; }
        .btn-start { background: var(--success); color: white; }
        .btn-stop { background: var(--accent); color: white; }
        .btn-speed { background: #3742fa; color: white; font-size: 1.5rem; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        
        #console { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 8px; height: 150px; overflow-y: auto; text-align: left; margin-top: 20px; border: 1px solid #333; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
    </style>
</head>
<body>
    <h3>Panel Bieżni FS-BT-D2</h3>
    
    <div id="connectionGroup">
        <button id="btnConnect" class="btn-connect">POŁĄCZ</button>
        <button id="btnDisconnect" class="btn-disconnect" style="display:none;">ROZŁĄCZ</button>
    </div>

    <div class="dashboard">
        <div class="card"><span class="unit">Prędkość</span><span id="v-speed" class="val">0.0</span><small>km/h</small></div>
        <div class="card"><span class="unit">Tętno</span><span id="v-hr" class="val hr-val">--</span><small>bpm</small></div>
        <div class="card"><span class="unit">Dystans</span><span id="v-dist" class="val">0</span><small>m</small></div>
        <div class="card"><span class="unit">Czas</span><span id="v-time" class="val">00:00</span><small>m:s</small></div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-start" disabled>START</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
        <button id="btnVDown" class="btn-speed" disabled>-</button>
        <button id="btnVUp" class="btn-speed" disabled>+</button>
    </div>

    <div id="console">System gotowy. Czekam na połączenie...</div>

    <script>
        let device, server, ctrlChar;
        let currentSpeedKmh = 0.0;

        function log(msg) {
            const el = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
        }

        document.getElementById('btnConnect').onclick = async () => {
            try {
                log("Skanowanie...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [0x1826] }],
                    optionalServices: [0x180D]
                });
                
                log("Łączenie z " + device.name);
                server = await device.gatt.connect();
                
                const ftms = await server.getPrimaryService(0x1826);
                ctrlChar = await ftms.getCharacteristic(0x2AD9);
                const dataChar = await ftms.getCharacteristic(0x2ACD);

                // Autoryzacja - OBOWIĄZKOWA
                log("Wysyłanie: Request Control (0x00)...");
                await ctrlChar.writeValue(new Uint8Array([0x00]));

                // Dane bieżni
                await dataChar.startNotifications();
                dataChar.oncharacteristicvaluechanged = (e) => {
                    const b = e.target.value;
                    if (b.byteLength < 15) return;
                    
                    currentSpeedKmh = b.getUint16(2, true) / 100;
                    document.getElementById('v-speed').textContent = currentSpeedKmh.toFixed(1);
                    document.getElementById('v-dist').textContent = b.getUint8(4) + (b.getUint8(5) << 8) + (b.getUint8(6) << 16);
                    
                    const t = b.getUint16(b.byteLength - 2, true);
                    document.getElementById('v-time').textContent = `${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
                };

                // Serwis Tętna (HR)
                try {
                    const hrService = await server.getPrimaryService(0x180D);
                    const hrChar = await hrService.getCharacteristic(0x2A37);
                    await hrChar.startNotifications();
                    hrChar.oncharacteristicvaluechanged = (e) => {
                        document.getElementById('v-hr').textContent = e.target.value.getUint8(1);
                    };
                    log("Tętno: Aktywne.");
                } catch(e) { log("Tętno: Brak serwisu."); }

                // UI
                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('btnDisconnect').style.display = 'block';
                ["btnStart", "btnStop", "btnVUp", "btnVDown"].forEach(id => document.getElementById(id).disabled = false);
                log("POŁĄCZONO I ZSYNCHRONIZOWANO.");
            } catch(e) { log("BŁĄD: " + e); }
        };

        document.getElementById('btnDisconnect').onclick = () => {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
                log("Rozłączono przez użytkownika.");
                location.reload(); 
            }
        };

        async function sendCmd(bytes, name) {
            if (!ctrlChar) return;
            try {
                log(`CMD: ${name} [${bytes.map(x => x.toString(16).padStart(2,'0')).join(' ')}]`);
                await ctrlChar.writeValue(new Uint8Array(bytes));
            } catch(e) { log(`BŁĄD CMD ${name}: ${e}`); }
        }

        document.getElementById('btnStart').onclick = () => sendCmd([0x07], "START");
        document.getElementById('btnStop').onclick = () => sendCmd([0x08, 0x01], "STOP");

        // TEST SKOKU 0.1 KM/H
        document.getElementById('btnVUp').onclick = () => setSpeed(currentSpeedKmh + 0.1);
        document.getElementById('btnVDown').onclick = () => setSpeed(currentSpeedKmh - 0.1);

        async function setSpeed(kmh) {
            let target = Math.max(0.8, Math.min(kmh, 16.0));
            const rawV = Math.round(target * 100);
            const payload = [0x02, rawV & 0xFF, (rawV >> 8) & 0xFF];
            await sendCmd(payload, `SET_SPEED ${target.toFixed(1)}`);
        }
    </script>
</body>
</html>
