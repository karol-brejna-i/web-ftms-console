<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bieżnia FS-BT-D2 Pro v11</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #ef4444; --success: #22c55e; --warn: #f59e0b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Status Bar */
        #status-indicator { background: var(--card); padding: 10px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .status-counting { border-left-color: var(--warn) !important; color: var(--warn); animation: blink 1s infinite; }
        .status-running { border-left-color: var(--success) !important; color: var(--success); }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 16px; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .lbl { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 5px; }
        .val { font-size: 2.2rem; font-weight: 800; display: block; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-conn { background: var(--primary); color: white; grid-column: span 2; }
        .btn-start { background: var(--success); color: white; }
        .btn-stop { background: var(--accent); color: white; }
        .btn-speed { background: #334155; color: white; font-size: 1.5rem; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        
        /* Konsola */
        #console-toggle { margin-top: 15px; font-size: 0.8rem; color: #64748b; cursor: pointer; text-decoration: underline; }
        #console { background: #000; color: #4ade80; font-family: 'Consolas', monospace; font-size: 10px; padding: 10px; border-radius: 8px; flex-grow: 1; overflow-y: auto; margin-top: 10px; display: none; border: 1px solid #334155; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="status-indicator">Gotowy do połączenia</div>

    <button id="btnConnect" class="btn-conn">POŁĄCZ Z BIEŻNIĄ</button>
    <button id="btnDisconnect" class="btn-stop" style="display:none; margin-bottom:10px;">ROZŁĄCZ</button>

    <div class="dashboard">
        <div class="card"><span class="lbl">Prędkość</span><span id="v-speed" class="val">0.0</span><small>km/h</small></div>
        <div class="card"><span class="lbl">Tętno</span><span id="v-hr" class="val" style="color:var(--accent)">--</span><small>bpm</small></div>
        <div class="card"><span class="lbl">Dystans</span><span id="v-dist" class="val">0</span><small>m</small></div>
        <div class="card"><span class="lbl">Czas</span><span id="v-time" class="val">00:00</span><small>m:s</small></div>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-start" disabled>START</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
        <button id="btnVDown" class="btn-speed" disabled>-</button>
        <button id="btnVUp" class="btn-speed" disabled>+</button>
    </div>

    <div id="console-toggle" onclick="toggleConsole()">Pokaż/ukryj konsolę logów</div>
    <div id="console"></div>

    <script>
        let device, ctrlChar;
        let appState = "IDLE"; // IDLE, STARTING, RUNNING, STOPPED
        let currentSpeed = 0.0;

        function log(msg, color = "#4ade80") {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.style.color = color;
            d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function toggleConsole() {
            const c = document.getElementById('console');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
        }

        function setUIStatus(text, className = "") {
            const el = document.getElementById('status-indicator');
            el.innerText = text;
            el.className = className;
        }

        document.getElementById('btnConnect').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [0x1826] }],
                    optionalServices: [0x180D]
                });
                const server = await device.gatt.connect();
                const ftms = await server.getPrimaryService(0x1826);
                
                ctrlChar = await ftms.getCharacteristic(0x2AD9);
                await ctrlChar.startNotifications();
                ctrlChar.oncharacteristicvaluechanged = handleControlResponse;

                const dataChar = await ftms.getCharacteristic(0x2ACD);
                await dataChar.startNotifications();
                dataChar.oncharacteristicvaluechanged = handleData;

                try {
                    const statusChar = await ftms.getCharacteristic(0x2ADA);
                    await statusChar.startNotifications();
                    statusChar.oncharacteristicvaluechanged = handleStatus;
                } catch(e) { log("Monitor statusu 0x2ADA niedostępny", "#64748b"); }

                // Serwis HR
                try {
                    const hrS = await server.getPrimaryService(0x180D);
                    const hrC = await hrS.getCharacteristic(0x2A37);
                    await hrC.startNotifications();
                    hrC.oncharacteristicvaluechanged = (e) => {
                        document.getElementById('v-hr').textContent = e.target.value.getUint8(1);
                    };
                } catch(e) {}

                await ctrlChar.writeValue(new Uint8Array([0x00])); // Req Control
                
                setUIStatus("Połączono - Gotowy");
                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('btnDisconnect').style.display = 'block';
                ["btnStart", "btnStop", "btnVUp", "btnVDown"].forEach(id => document.getElementById(id).disabled = false);
            } catch(e) { log("BŁĄD: " + e, "#ef4444"); }
        };

        function handleControlResponse(e) {
            const b = e.target.value;
            if(b.getUint8(0) === 0x80 && b.getUint8(1) === 0x07 && b.getUint8(2) === 0x01) {
                log("Komenda START zaakceptowana", "#22c55e");
                appState = "STARTING";
                setUIStatus("Odliczanie...", "status-counting");
            }
        }

        function handleStatus(e) {
            const op = e.target.value.getUint8(0);
            log(`STATUS RX: 0x${op.toString(16).toUpperCase()}`, "#f59e0b");
            
            if (op === 0x02) {
                appState = "STOPPED";
                setUIStatus("Zatrzymano", "");
            }
        }

        function handleData(e) {
            const b = e.target.value;
            if (b.byteLength < 15) return;

            currentSpeed = b.getUint16(2, true) / 100;
            document.getElementById('v-speed').textContent = currentSpeed.toFixed(1);
            
            // Logika zmiany stanu na podstawie prędkości
            if (appState === "STARTING" && currentSpeed > 0) {
                appState = "RUNNING";
                setUIStatus("Bieg w toku", "status-running");
            }

            document.getElementById('v-dist').textContent = b.getUint8(4) + (b.getUint8(5) << 8) + (b.getUint8(6) << 16);
            const t = b.getUint16(b.byteLength - 2, true);
            document.getElementById('v-time').textContent = `${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
        }

        document.getElementById('btnDisconnect').onclick = () => { device.gatt.disconnect(); location.reload(); };

        async function send(bytes, name) {
            try {
                await ctrlChar.writeValue(new Uint8Array(bytes));
                log(`Wysłano: ${name}`);
            } catch(e) { log("Błąd wysyłania: " + name, "#ef4444"); }
        }

        document.getElementById('btnStart').onclick = () => send([0x07], "START");
        document.getElementById('btnStop').onclick = () => send([0x08, 0x01], "STOP");
        
        // Zmiana o 0.1 km/h
        document.getElementById('btnVUp').onclick = () => setSpeed(currentSpeed + 0.1);
        document.getElementById('btnVDown').onclick = () => setSpeed(currentSpeed - 0.1);

        async function setSpeed(v) {
            let target = Math.max(0.8, Math.min(v, 16.0));
            const raw = Math.round(target * 100);
            await send([0x02, raw & 0xFF, (raw >> 8) & 0xFF], `SetSpeed ${target.toFixed(1)}`);
        }
    </script>
</body>
</html>
